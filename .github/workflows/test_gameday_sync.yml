name: Test GameDay Sync (Manual & Schedule)

on:
  schedule:
    - cron: '5 15 * * *'
    - cron: '6 15 * * *'
  workflow_dispatch:

jobs:
  run-gameday-sync:
    runs-on: ubuntu-latest

    # --- SPIN UP POSTGRESQL DATABASE ---
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gameday_sync
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        # Wait until postgres is healthy before starting the .NET build
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
          
      - name: Restore Dependencies
        run: dotnet restore GameDay-Sync/GameDay-Sync.csproj
      
      # --- NEW: INSTALL TOOL & MIGRATE DATABASE INFRASTRUCTURE ---
      - name: Install EF Core Tool
        run: dotnet tool install --global dotnet-ef

      - name: Apply Database Migrations
        run: dotnet ef database update --project GameDay-Sync --startup-project GameDay-Sync
      
      # --- ROUTING FOR TEST STEPS ---
      - name: Run Daily Notification Test
        if: github.event.schedule == '5 15 * * *'
        run: dotnet run --project GameDay-Sync -- --daily