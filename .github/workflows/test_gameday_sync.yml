name: Test GameDay Sync (Manual & Schedule)

on:
  schedule:
    - cron: '5 15 * * *'
    - cron: '6 15 * * *'
  workflow_dispatch:

jobs:
  run-gameday-sync:
    runs-on: ubuntu-latest

    # --- SPIN UP POSTGRESQL DATABASE ---
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gameday_sync
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        # Wait until postgres is healthy before starting the .NET build
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Restore Dependencies
        run: dotnet restore GameDay-Sync/GameDay-Sync.csproj
      
      # --- OPTIONAL: RUN MIGRATIONS IF NEEDED ---
      # Un-comment the next two lines if your app needs to build tables before running
      # - name: Database Migration
      #   run: dotnet ef database update --project GameDay-Sync
      
      # --- ROUTING FOR TEST STEPS ---
      - name: Run Daily Notification Test
        if: github.event.schedule == '5 15 * * *'
        run: dotnet run --project GameDay-Sync -- --daily

      - name: Run Weekly Notification Test
        if: github.event.schedule == '6 15 * * *'
        run: dotnet run --project GameDay-Sync -- --weekly

      - name: Manual Run Execution
        if: github.event_name == 'workflow_dispatch'
        run: dotnet run --project GameDay-Sync -- --daily