name: Test GameDay Sync (Manual & Schedule)

on:
  schedule:
    - cron: '5 15 * * *'
    - cron: '6 15 * * *'
  workflow_dispatch:

jobs:
  run-gameday-sync:
    runs-on: ubuntu-latest

    # --- SPIN UP POSTGRESQL DATABASE ---
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gameday_sync
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Restore Dependencies
        run: dotnet restore GameDay-Sync/GameDay-Sync.csproj

      # --- FIXED SCHEMA WORKAROUND ---
      # This connects directly to the container database and forces the games table to exist
      # so your old migrations don't crash the build during runtime testing.
      - name: Pre-build Raw Tables in Postgres
        env:
          PGPASSWORD: password
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d gameday_sync -c 'CREATE TABLE IF NOT EXISTS games (id SERIAL PRIMARY KEY, league VARCHAR(255));'
      
      # --- INSTALL TOOL & MIGRATE DATABASE INFRASTRUCTURE ---
      - name: Install EF Core Tool
        run: dotnet tool install --global dotnet-ef

      # This will now pass because the "games" table exists structurally when it reaches InitialCreateThree!
      - name: Apply Database Migrations
        run: dotnet ef database update --project GameDay-Sync --startup-project GameDay-Sync
      
      # --- ROUTING FOR TEST STEPS ---
      - name: Run Daily Notification Test
        if: github.event.schedule == '5 15 * * *'
        run: dotnet run --project GameDay-Sync -- --daily

      - name: Run Weekly Notification Test
        if: github.event.schedule == '6 15 * * *'
        run: dotnet run --project GameDay-Sync -- --weekly

      # This step handles your instant "Run workflow" clicks in the browser dashboard
      - name: Manual Run Execution
        if: github.event_name == 'workflow_dispatch'
        run: dotnet run --project GameDay-Sync -- --daily