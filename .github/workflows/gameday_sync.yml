name: Production GameDay Sync Automation

on:
  schedule:
    - cron: '0 8 * * *'  # Runs every single day at 8:00 AM UTC
    - cron: '0 8 * * 1'  # Runs every Monday at 8:00 AM UTC

jobs:
  run-gameday-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Restore Dependencies
        run: dotnet restore GameDay-Sync/GameDay-Sync.csproj

      - name: Install EF Core Tool
        run: dotnet tool install --global dotnet-ef

      # Automatically applies your local migration blueprints straight onto Neon
      - name: Migrate Production Neon Database
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTION_STRING }}
        run: dotnet ef database update --project GameDay-Sync --startup-project GameDay-Sync
      
      # --- AUTOMATED CRON INTERVAL ROUTING ---
      - name: Run Daily Notification Route
        if: github.event.schedule == '0 8 * * *'
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTION_STRING }}
        run: dotnet run --project GameDay-Sync -- --daily

      - name: Run Weekly Notification Route
        if: github.event.schedule == '0 8 * * 1'
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTION_STRING }}
        run: dotnet run --project GameDay-Sync -- --weekly

      # --- MANUAL TRIGGER OVERRIDE ---
      - name: Manual Run Execution
        if: github.event_name == 'workflow_dispatch'
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTION_STRING }}
        run: dotnet run --project GameDay-Sync -- --weekly