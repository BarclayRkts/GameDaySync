name: Production GameDay Sync Automation

on:
  schedule:
    - cron: '0 13 * * *'  # Runs EVERY DAY at 8:00 AM Central Time (13:00 UTC)
    - cron: '0 13 * * 1'  # Runs EVERY MONDAY at 8:00 AM Central Time (13:00 UTC)
  workflow_dispatch:      # manual run button

jobs:
  run-gameday-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Restore Dependencies
        run: dotnet restore GameDay-Sync/GameDay-Sync.csproj

      - name: Install EF Core Tool
        run: dotnet tool install --global dotnet-ef

      # --- CLEAN PLATFORM DATABASE BLUEPRINT ---
      # Deletes broken VM migration histories, checks active models, and creates Neon tables.
      - name: Migrate Production Neon Database Schema
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTION_STRING }}
        run: |
          rm -rf GameDay-Sync/Migrations/*
          dotnet ef migrations add ProductionReset --project GameDay-Sync --startup-project GameDay-Sync
          dotnet ef database update --project GameDay-Sync --startup-project GameDay-Sync
      
      # --- AUTOMATED CRON INTERVAL ROUTING ---
      - name: Run Daily Notification Route
        if: github.event.schedule == '0 13 * * *'
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTION_STRING }}
        run: dotnet run --project GameDay-Sync -- --daily

      - name: Run Weekly Notification Route
        if: github.event.schedule == '0 13 * * 1'
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTION_STRING }}
        run: dotnet run --project GameDay-Sync -- --weekly

      # --- MANUAL TRIGGER OVERRIDE ---
      # Default testing fallback updated to run the --weekly route when triggered manually.
      - name: Manual Run Execution
        if: github.event_name == 'workflow_dispatch'
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTION_STRING }}
        run: dotnet run --project GameDay-Sync -- --weekly