name: GameDay Sync Scheduler

on:
  schedule:
    - cron: '0 8 * * *'  # Runs every single day at 8:00 AM UTC
    - cron: '0 8 * * 1'  # Runs every Monday at 8:00 AM UTC

jobs:
  run-gameday-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0' # Adjust to 7.0 or 9.0 if your project uses a different version

      - name: Restore Dependencies
        run: dotnet restore
      
      # --- ROUTING LOGIC BASED ON THE SCHEDULE TRIGGER ---
      
      # 1. If triggered on a Monday, run the weekly pipeline
      - name: Run Weekly Notification Engine
        if: github.event.schedule == '0 8 * * 1'
        run: dotnet run --project GameDay_Sync -- --weekly
      
      # 2. If triggered on any other day, run the daily pipeline
      - name: Run Daily Notification Engine
        if: github.event.schedule == '0 8 * * *'
        run: dotnet run --project GameDay_Sync -- --daily
